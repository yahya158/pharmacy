<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Online pharmacy</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<style>
		form{
			height: 110vh;
		}
		.reg{
			height:90vh;
		}
		.language-select{
			position: relative;
			left: 35%;
			padding: 5px 15px;
			border-radius: 20px;
			border:1px solid rgba(255, 255, 255, 0.3);
			background: rgba(255, 255, 255, 0.2);
			color:#333;
			cursor:pointer;
			font-size:0.85rem;
			outline: none;
			transition:0.3s;
		}
		.language-select:hover {
			background: rgba(255, 255, 255, 0.4);
		}
		.agebar{
			margin: 10px;
			font-family: Times New Roman;
		}
		.radio-group{
			display: flex;
			align-items: center;
			gap:20px;
			margin-top:5px;
		}
		.radio-group label{
			display: flex;
			align-items: center;
			gap:8px;
			cursor: pointer;
		}
	</style>
</head>
<body>
<div class="reg">
<form>
<div class="language">
<select name="language" class="language-select">
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
  <option value="hi">Hindi</option>
  <option value="Arabic">Arabic</option>
  <option value="sw">Kiswahili</option>
</select>
</div>
<br>
	<label>First Name</label>
	<input type="text" required class="bar"><br>
	<label>Last Name</label>
	<input type="text" required class="bar"><br>
	<div class="radio-group">
	<label>Male</label>
	<input type="radio" name="male" required>
	<label>Female</label>
	<input type="radio" name="male" required><br>
  </div>
	<label>Age</label>
	<input type="number" required class="agebar"><br>
	<label>Phone Number</label>
	<input type="Phone" required class="bar"><br>
	<label>Email</label>
	<input type="Email" required class="bar"><br>
	<label>Password</label>
	<input type="password" class="bar"><br>
	<button type="submit" required>REGISTER</button><br>
	<p>Already have an account? <a href="login.html">Login</a></p>
</form>
</div>
</body>
</html>
